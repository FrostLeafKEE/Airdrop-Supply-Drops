name: Build

on:
  push:
    branches:
      - forge-1.20.1
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew build --stacktrace

      - name: Show built files
        run: ls -lh build/libs

      - name: Read mod version from built jar
        id: mod
        run: |
          jar_file=$(basename "$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -n 1)")
          mod_version=$(echo "$jar_file" | sed -E 's/^.*-([0-9][0-9A-Za-z._+-]*)\.jar$/\1/')
          echo "jar=$jar_file" >> "$GITHUB_OUTPUT"
          echo "version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "Detected: $jar_file (version $mod_version)"

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: airdrop-supply-drops-${{ steps.mod.outputs.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: airdrop_supply_drops-bundles-${{ steps.mod.outputs.version }}
          path: build/libs/*.zip
          if-no-files-found: ignore
          retention-days: 90
