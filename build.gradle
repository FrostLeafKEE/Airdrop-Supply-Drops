plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// GameTest sources compile into the main source set: the 1.21.1 modular launch
// (bootstrap 2.1.x) builds one module per classpath directory, and a separate
// resources directory becomes a classes-less mod file whose annotation scan
// finds no @Mod class, failing mod loading. Resources are therefore laid out
// together with classes, matching the shipped jar structure. Test classes and
// the test structure are excluded from the release jar below.
sourceSets.main {
    java.srcDir 'src/gametest/java'
    resources.srcDir layout.buildDirectory.dir('generated/gametestResources')
    output.resourcesDir = file("$buildDir/classes/java/main")
}

tasks.register('compileGameTestJava') {
    group = 'build'
    description = 'Compiles the gametest sources (part of main on 1.21.1; kept for command compatibility).'
    dependsOn tasks.named('compileJava')
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Official mappings are used at runtime since 1.20.2; no reobfuscation step exists any more.
    reobf = false

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run-1.21.1')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (project.hasProperty('dimensionCheck')) {
                workingDirectory project.file('run-dimensioncheck-1.21.1')
                property 'airdrop.dimensionCheck', 'true'
                property 'airdrop.dimensionCheckWorld', project.property('dimensionCheck')
            }
            if (project.hasProperty('soundCheck')) {
                workingDirectory project.file('run-soundcheck-1.21.1')
                property 'airdrop.soundCheck', 'true'
            }
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('heldPreview')) {
                workingDirectory project.file('run-clientcheck-1.21.1')
                property 'airdrop.heldPreview', 'true'
            }
            if (project.hasProperty('restartCheck')) {
                workingDirectory project.file('run-clientcheck-1.21.1')
                property 'airdrop.restartCheck', project.property('restartCheck')
            }
            if (project.hasProperty('worldCheck')) {
                workingDirectory project.file('run-clientcheck-1.21.1')
                property 'airdrop.worldCheck', 'true'
            }
            if (project.hasProperty('clientCheck')) {
                workingDirectory project.file('run-clientcheck-1.21.1')
                property 'airdrop.clientCheck', 'true'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest-supply-1.21.1')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data-1.21.1')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// A separate empty test structure; neither tests nor this fixture ship in the mod jar.
tasks.register('generateGameTestStructure') {
    def target = layout.buildDirectory.file('generated/gametestResources/data/airdrop_supply_drops/structure/empty.nbt')
    outputs.file(target)
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(file))).withCloseable { out ->
            out.writeByte(10); out.writeUTF('')
            out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3955)
            out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
            3.times { out.writeInt(5) }
            out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
            out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
            ['blocks', 'entities'].each { name ->
                out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
            }
            out.writeByte(0)
        }
    }
}
tasks.named('processResources').configure { dependsOn 'generateGameTestStructure' }
tasks.register('installExampleGameTestPack', Copy) {
    from 'example_datapack'
    into 'run-gametest-supply-1.21.1/world/datapacks/airdrop_example'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'installExampleGameTestPack'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    from('LICENSE')
    // GameTest/check sources and fixtures are development-only; never ship them.
    exclude 'com/prtsnote/airdrop/gametest/**'
    exclude 'data/airdrop_supply_drops/structure/empty.nbt'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('releaseSources', Zip) {
    archiveFileName = "${mod_id}-${mod_version}-sources.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat', 'build.gradle', 'settings.gradle', 'gradle.properties'
        include 'LICENSE', 'README.md', 'INTEGRATION.md', 'ID-MIGRATION.md', 'PARACHUTE-PBR.md', 'SIGNAL-TUBE.md', 'MODEL-APPEARANCES.md', '.gitignore', '.gitattributes'
        include 'example_datapack/**', 'example_resourcepack/**', 'example_appearance_resourcepack/**', 'art/**', 'audio/**'
    }
}

tasks.register('releaseExampleDatapack', Zip) {
    archiveFileName = "${mod_id}-example-datapack.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('example_datapack')
    from('INTEGRATION.md')
}

tasks.register('releaseExampleResourcepack', Zip) {
    archiveFileName = "${mod_id}-example-resourcepack.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('example_resourcepack') { exclude 'README.md' }
    from('PARACHUTE-PBR.md')
}

tasks.register('releaseExampleAppearanceResourcepack', Zip) {
    archiveFileName = "${mod_id}-example-appearances.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('example_appearance_resourcepack') { exclude 'README.md' }
    from('MODEL-APPEARANCES.md')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
